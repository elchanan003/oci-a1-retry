name: oci-a1-retry
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: oci-a1-retry
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Configure OCI auth
        run: |
          mkdir -p ~/.oci && chmod 700 ~/.oci
          printf '%s' "${{ secrets.OCI_KEY_B64 }}" | base64 -d > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=il-jerusalem-1
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
      - name: Install OCI CLI
        run: pip install -q oci-cli
      - name: Retry launch (long-running loop, ~5h40m)
        id: r
        env:
          SUPPRESS_LABEL_WARNING: "True"
          T: ${{ secrets.OCI_TENANCY }}
          BV: ${{ secrets.OCI_BOOTVOL }}
          SUB: ${{ secrets.OCI_SUBNET }}
        run: |
          AD="npHA:IL-JERUSALEM-1-AD-1"
          EXIST=$(oci compute instance list -c "$T" --query "length(data[?\"display-name\"=='free-vm-2' && \"lifecycle-state\"!='TERMINATED'])" --raw-output 2>/dev/null)
          if [ -n "$EXIST" ] && [ "$EXIST" != "0" ]; then echo "result=exists" >> "$GITHUB_OUTPUT"; echo "free-vm-2 already exists"; exit 0; fi
          END=$(( $(date +%s) + 20400 ))   # loop for ~5h40m, under GitHub's 6h job cap
          # Try the full free shape first; if it's out of capacity, try a smaller
          # slice that's easier for Oracle to schedule onto a partially-full host.
          # Both boot the SAME 200GB volume (data intact); a 1-OCPU catch can be
          # resized up to 2/12 afterwards (reboot, no disk change).
          try_launch() {  # $1=ocpus $2=memGB -> prints oci output
            oci --no-retry compute instance launch \
              --availability-domain "$AD" --compartment-id "$T" \
              --shape VM.Standard.A1.Flex --shape-config "{\"ocpus\":$1,\"memoryInGBs\":$2}" \
              --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"$BV\"}" \
              --subnet-id "$SUB" --assign-public-ip true --display-name free-vm-2 2>&1 || true
          }
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            THROTTLED=""
            for SHAPE in "2 12" "1 6"; do
              set -- $SHAPE
              OUT=$(try_launch "$1" "$2")
              if printf '%s' "$OUT" | grep -q '"id": "ocid1.instance'; then
                echo "result=success" >> "$GITHUB_OUTPUT"
                echo "shape=$1 OCPU / $2 GB" >> "$GITHUB_OUTPUT"
                echo "LAUNCHED at $1 OCPU / $2 GB after $i rounds"; exit 0
              fi
              R=$(printf '%s' "$OUT" | grep -oE 'Out of host capacity|Too many requests|TooManyRequests' | head -1)
              echo "round $i, shape ${1}/${2} ($(date -u +%H:%M:%S) UTC): ${R:-unknown}"
              if printf '%s' "$R" | grep -qi 'too many'; then THROTTLED=1; break; fi
            done
            # back off longer when throttled so the next round actually checks capacity
            if [ -n "$THROTTLED" ]; then sleep 120; else sleep 75; fi
          done
          echo "result=nocap" >> "$GITHUB_OUTPUT"; echo "no capacity in this ~5h40m window"
      - name: Announce success and stop scheduling
        if: steps.r.outputs.result == 'success' || steps.r.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
          SHAPE: ${{ steps.r.outputs.shape || 'already existed' }}
        run: |
          BODY=$'The Oracle free-tier A1 instance **free-vm-2** launched successfully (capacity was finally available). Caught at: **'"$SHAPE"$'**.\n\nIf it was caught at **1 OCPU / 6 GB**, resize it up to the full free 2 OCPU / 12 GB once it is running (Console \xe2\x86\x92 free-vm-2 \xe2\x86\x92 Edit \xe2\x86\x92 change shape config; one reboot, boot volume/data untouched).\n\nGet its public IP from the OCI Console (Compute \xe2\x86\x92 Instances \xe2\x86\x92 free-vm-2) or ask Claude to fetch it. Then TEAR DOWN: delete the OCI API key in the Console, and delete this repository/workflow.'
          gh issue create --repo "${{ github.repository }}" \
            --title "✅ free-vm-2 is UP — Oracle capacity caught ($SHAPE)" \
            --body "$BODY" || true
          gh workflow disable oci-a1-retry --repo "${{ github.repository }}" || true
