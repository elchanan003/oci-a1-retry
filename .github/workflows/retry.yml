name: oci-a1-retry
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: oci-a1-retry
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Configure OCI auth
        run: |
          mkdir -p ~/.oci && chmod 700 ~/.oci
          printf '%s' "${{ secrets.OCI_KEY_B64 }}" | base64 -d > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=il-jerusalem-1
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
      - name: Install OCI CLI
        run: pip install -q oci-cli
      - name: Retry launch (long-running loop, ~5h40m)
        id: r
        env:
          SUPPRESS_LABEL_WARNING: "True"
          T: ${{ secrets.OCI_TENANCY }}
          BV: ${{ secrets.OCI_BOOTVOL }}
          SUB: ${{ secrets.OCI_SUBNET }}
        run: |
          AD="npHA:IL-JERUSALEM-1-AD-1"
          EXIST=$(oci compute instance list -c "$T" --query "length(data[?\"display-name\"=='free-vm-2' && \"lifecycle-state\"!='TERMINATED'])" --raw-output 2>/dev/null)
          if [ -n "$EXIST" ] && [ "$EXIST" != "0" ]; then echo "result=exists" >> "$GITHUB_OUTPUT"; echo "free-vm-2 already exists"; exit 0; fi
          END=$(( $(date +%s) + 20400 ))   # loop for ~5h40m, under GitHub's 6h job cap
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            # --no-retry => one API call per attempt (no internal retries that burn the rate limit)
            OUT=$(oci --no-retry compute instance launch \
              --availability-domain "$AD" --compartment-id "$T" \
              --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --source-details "{\"sourceType\":\"bootVolume\",\"bootVolumeId\":\"$BV\"}" \
              --subnet-id "$SUB" --assign-public-ip true --display-name free-vm-2 2>&1 || true)
            if printf '%s' "$OUT" | grep -q '"id": "ocid1.instance'; then
              echo "result=success" >> "$GITHUB_OUTPUT"; echo "LAUNCHED after $i attempts"; exit 0
            fi
            R=$(printf '%s' "$OUT" | grep -oE 'Out of host capacity|Too many requests|TooManyRequests' | head -1)
            echo "attempt $i ($(date -u +%H:%M:%S) UTC): ${R:-unknown}"
            # back off longer when throttled so the next attempt actually checks capacity
            if printf '%s' "$R" | grep -qi 'too many'; then sleep 120; else sleep 75; fi
          done
          echo "result=nocap" >> "$GITHUB_OUTPUT"; echo "no capacity in this ~5h40m window"
      - name: Announce success and stop scheduling
        if: steps.r.outputs.result == 'success' || steps.r.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "✅ free-vm-2 is UP — Oracle capacity caught" \
            --body "The Oracle free-tier A1 instance **free-vm-2** launched successfully (capacity was finally available). Get its public IP from the OCI Console (Compute → Instances → free-vm-2) or ask Claude to fetch it. Then TEAR DOWN: delete the OCI API key in the Console, and delete this repository/workflow." || true
          gh workflow disable oci-a1-retry --repo "${{ github.repository }}" || true
